# d99.ini — example manifest for d99-build.
#
# One file fully describes the package: metadata, payload mapping,
# conffiles, and maintainer scripts.  Build with:
#
#     d99-build --manifest d99.ini

[package]
name = hello-d99
version = 1.0-1
architecture = auto          ; "auto" resolves to the host Debian arch
section = utils
priority = optional
maintainer = Foggy <foggy@example.org>
depends =                   ; auto-depends from ELF scanning get merged here
description = Friendly greeter for the d99 toolchain
 A longer description follows on indented continuation lines.
 d99-build scans compiled payloads with its internal ELF parser and
 injects exact library dependencies automatically.

[files]
; install-path = source-path (relative to this manifest)
/usr/bin/hello-d99 = files/hello
/etc/hello-d99/hello.conf = files/hello.conf

[conffiles]
/etc/hello-d99/hello.conf

[scripts]
postinst = scripts/postinst
prerm     = scripts/prerm
postrm    = scripts/postrm
