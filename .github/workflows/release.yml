name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev libzstd-dev

      - name: Build and test
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make VERSION="${VERSION}" -j$(nproc) check

      - name: Package release
        run: |
          tar -czf "d99-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C output/bin d99-deb d99-query d99-inst d99-solve d99-build
          tar -czf d99-linux-amd64.tar.gz -C output/bin d99-deb d99-query d99-inst d99-solve d99-build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: d99 ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            d99-${{ github.ref_name }}-linux-amd64.tar.gz
            d99-linux-amd64.tar.gz
