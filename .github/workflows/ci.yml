name: ci

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev libzstd-dev

      - name: Build and test
        run: make -j$(nproc) check

      - name: Package artifacts
        run: |
          tar -czf d99-nightly-linux-amd64.tar.gz -C output/bin d99-deb d99-query d99-inst d99-solve d99-build
          cp d99-nightly-linux-amd64.tar.gz d99-linux-amd64.tar.gz

      - name: Upload nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: d99 Nightly
          prerelease: true
          files: |
            d99-nightly-linux-amd64.tar.gz
            d99-linux-amd64.tar.gz
