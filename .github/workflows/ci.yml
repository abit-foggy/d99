name: ci

on:
  push:
    branches:
      - '**'
      - '!deb'
    tags-ignore:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev libzstd-dev apt-utils dpkg-dev

      - name: Build and test
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          make VERSION="999.0.0+nightly.${SHORT_SHA}" -j$(nproc) check

      - name: Package artifacts
        run: |
          tar -czf d99-linux-amd64.tar.gz -C output/bin d99-deb d99-query d99-inst d99-solve d99-build

      - name: Update nightly git tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin nightly

      - name: Upload nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly
          prerelease: true
          make_latest: false
          files: d99-linux-amd64.tar.gz

      - name: Build Debian APT repository and Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          .github/scripts/build-deb-repo.sh site

      - name: Update deb branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin deb:deb || git branch deb origin/deb
          git worktree add /tmp/deb-worktree deb
          rm -rf /tmp/deb-worktree/repo /tmp/deb-worktree/index.html
          cp -r site/* /tmp/deb-worktree/
          cd /tmp/deb-worktree
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(repo): update deb repository [skip ci] (${GITHUB_SHA::7})"
            git push origin deb
          fi
          cd -
          git worktree remove /tmp/deb-worktree

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
